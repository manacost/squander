name: WebGPU verification

on:
  push:
    branches: "main"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webgpu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webgpu:
    # This label must identify a trusted runner with a real WebGPU device.
    runs-on: [self-hosted, linux, x64, webgpu]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Record graphics host environment
        shell: bash
        run: |
          {
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "os=$(uname -a)"
            echo "node=$(node --version)"
            if command -v nvidia-smi >/dev/null 2>&1; then
              nvidia-smi
            else
              echo "nvidia-smi unavailable"
            fi
            if command -v vulkaninfo >/dev/null 2>&1; then
              vulkaninfo --summary
            else
              echo "vulkaninfo unavailable"
            fi
          } | tee webgpu-host-environment.txt

      - name: Run real WebGPU verification
        run: npm run test:webgpu

      - name: Upload WebGPU verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webgpu-verification-results
          path: |
            webgpu-host-environment.txt
            playwright-report/
            test-results/
          if-no-files-found: ignore
